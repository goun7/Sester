name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    services:
      # PG-parite bacakları (test_pg_parity / test_migrate_pg / test_minor_unit)
      # varsayılan CI'da da koşsun — SQLite↔PG aynı-hash tezi antrenilmiş
      # olmadan "parite" iddiası boşta kalıyordu.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sester
          POSTGRES_PASSWORD: sester
          POSTGRES_DB: sester
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e .[dev]
      - name: Fail-closed smoke (bozuk politika testi)
        run: |
          python - <<'PY'
          from sester.policy import DenyAll
          d = DenyAll().evaluate(0.05, "/weather")
          assert d.verdict == "deny" and d.rule_id == "fail-closed"
          print("fail-closed smoke OK")
          PY
      - name: Tests
        env:
          SESTER_PG_DSN: postgresql://sester:sester@localhost:5432/sester
        run: python -m pytest tests/ -q

  bridges:
    name: Cross-repo bridges (Tamga + Veridict)
    runs-on: ubuntu-latest
    # Kardeş-repolar GitHub'a yayında olunca aç: repo variable'ları ayarla
    # (Settings → Secrets and variables → Actions → Variables):
    #   SESTER_TAMGA_REPO    = "org/tamga-protocol"
    #   SESTER_VERIDICT_REPO = "org/veridict"
    if: vars.SESTER_TAMGA_REPO && vars.SESTER_VERIDICT_REPO
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SESTER_TAMGA_REPO }}
          ref: main
          path: siblings/tamga
      - uses: actions/checkout@v4
        with:
          repository: ${{ vars.SESTER_VERIDICT_REPO }}
          ref: main
          path: siblings/veridict
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Cross-repo bridge tests (K1 + K3, temiz + bozuk)
        env:
          SESTER_TAMGA_PATH: ${{ github.workspace }}/siblings/tamga
          SESTER_VERIDICT_PATH: ${{ github.workspace }}/siblings/veridict
        run: |
          python -m pytest tests/test_bridges_crossrepo.py -v
          # sovereign_verify sarmalayıcısının çağırdığı donuk Sester yüzeyi
          # (Ledger(path).verify_chain().close()) — gerçek wrapper ile koşar
          python -m pytest tests/test_sovereign_compat.py -v
          # Alıcılar pür-stdlib: kardeş-repoların kendi selftestleri de koşar
          python siblings/tamga/tamga_pugio_receiver.py --selftest
          python siblings/veridict/scripts/pugio_watch_receiver.py --selftest
