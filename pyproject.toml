[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sester"
version = "0.5.0"
description = "SESTER — x402-style metering, quota, fail-closed policy and hash-chain receipts for AI-agent APIs, as one ASGI middleware."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "SESTER contributors" }]
keywords = ["x402", "ai-agents", "metering", "payments", "middleware", "asgi", "quota", "ap2", "acp", "ucp", "escalation", "sester"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Framework :: FastAPI",
  "Topic :: Internet :: WWW/HTTP :: WSGI :: Middleware",
  "Topic :: Office/Business :: Financial",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
# Çekirdek saf ASGI + stdlib: sıfır zorunlu bağımlılık
dependencies = []

[project.optional-dependencies]
evm = ["eth-account>=0.13"]           # exact-sester EVM imza-dogrulaması
jws = ["cryptography>=42"]            # AP2 mandate ES256 (HS256 stdlib'te)
pg = ["psycopg[binary]>=3.1"]         # Postgres ledger backend
demo = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]  # demo API + panel sunucusu
facilitator = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]  # S5 hosted-facilitator servisi
dev = ["pytest>=8", "httpx>=0.27", "eth-account>=0.13", "fastapi>=0.110", "uvicorn[standard]>=0.29", "cryptography>=42", "psycopg[binary]>=3.1", "pillow>=10", "build>=1", "twine>=5"]

[project.urls]
Homepage = "https://github.com/goun7/sester"
Documentation = "https://github.com/goun7/sester/tree/main/docs"
# Not (ESKI_KIMLIK.md): dağıtım-adı `sester` — PyPI/Crates/NPM/.ai/.io taramaları
# %100 temiz (2026-09-13). Donuk kablo-alanları (pugio0, pugio_bundle_version,
# pugio_evidence_bundle, source:sikke) alıcı-uyumu için korunur.

[tool.hatch.build.targets.wheel]
packages = ["sester"]

[tool.pytest.ini_options]
testpaths = ["tests"]
